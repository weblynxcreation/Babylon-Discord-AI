<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Babylon Stock Market</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Babylon Stock Market</h1>
    </header>

    <section id="loginView" hidden>
      <form id="loginForm">
        <label>Email<input type="email" id="email" required autocomplete="username" /></label>
        <label>Password<input type="password" id="password" required autocomplete="current-password" /></label>
        <button type="submit">Log in</button>
        <p id="loginError" class="error" hidden></p>
      </form>
    </section>

    <section id="statusView" hidden>
      <p><strong>Logged in as</strong> <span id="userName"></span></p>
      <p id="linkStatus"></p>
      <ul id="companyList"></ul>
      <button id="syncNowBtn">Relay session now</button>
      <button id="logoutBtn" class="secondary">Log out</button>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
